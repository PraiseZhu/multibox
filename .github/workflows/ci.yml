name: CI

# Runs on the project's own machines, not GitHub-hosted runners. Pull requests
# from forks never run here unless a maintainer approves them after reading
# their changes; the repository requires that approval for every outside
# contributor, and the jobs below skip fork pull requests on top of it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    # cmd, because Windows PowerShell can turn cargo's progress on stderr into
    # a failure.
    defaults:
      run:
        shell: cmd
    steps:
      # This log is public. From here on, what would say whose machine runs
      # it reads as ***: the home directory, the computer and the runner. The
      # runner's own header above this step still names the computer; nothing
      # in a workflow reaches that.
      - name: Mask the machine
        run: |
          echo ::add-mask::%USERPROFILE%
          set "SLASHED=%USERPROFILE:\=/%"
          echo ::add-mask::%SLASHED%
          echo ::add-mask::%COMPUTERNAME%
          echo ::add-mask::%RUNNER_NAME%
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Licenses, known vulnerabilities and where crates come from, for every
      # platform there are releases for: see deny.toml.
      - name: Dependencies
        run: |
          cargo install --locked cargo-deny@0.20.2 || exit /b 1
          cargo deny --locked check
      - name: Test on NTFS, in copy mode
        run: cargo test --workspace
      # The runner names a directory on a Dev Drive in its .env file.
      - name: Test on a Dev Drive, with reflinks
        run: |
          if "%MULTIBOX_REFLINK_TMP%"=="" (
            echo ::notice::this runner has no MULTIBOX_REFLINK_TMP, reflinks untested
            exit /b 0
          )
          if not exist "%MULTIBOX_REFLINK_TMP%" mkdir "%MULTIBOX_REFLINK_TMP%"
          set "TMP=%MULTIBOX_REFLINK_TMP%"
          set "TEMP=%MULTIBOX_REFLINK_TMP%"
          cargo test --workspace

  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # As on Windows: the home directory, the computer and the runner read
      # as *** in this public log from here on.
      - name: Mask the machine
        run: |
          for value in "$HOME" "$(scutil --get ComputerName 2>/dev/null)" \
            "$(scutil --get LocalHostName 2>/dev/null)" "$(hostname)" "$RUNNER_NAME"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test on APFS, with reflinks
        run: cargo test --workspace
