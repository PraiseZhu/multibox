name: Release

# Pushing a tag such as v0.1.0 builds git-multibox and its window, multibox-ui,
# on the project's own Windows and Mac machines and publishes the archives with
# their checksums. Each archive holds both programs: `git multibox ui` starts
# the one installed beside it. It also holds THIRD-PARTY-LICENSES.md, the
# notices of every crate compiled into them, which their licenses ask to travel
# with each copy.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64]
    # cmd, because Windows PowerShell can turn cargo's progress on stderr into
    # a failure.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      # Dependencies' panic messages carry the paths of their sources, which
      # would put the build machine's home directory, and the account name in
      # it, into every copy. rustc writes them as ~ and . instead; the check
      # after the build fails the release if any is left.
      - name: Build
        run: |
          set "RUSTFLAGS=--remap-path-prefix=%USERPROFILE%=~ --remap-path-prefix=%CD%=."
          cargo build --release --locked -p git-multibox -p multibox-ui || exit /b 1
          findstr /m /i /l /c:"%USERPROFILE%" target\release\git-multibox.exe target\release\multibox-ui.exe
          if not errorlevel 1 (
            echo ::error::the programs above still hold paths of the build machine
            exit /b 1
          )
          exit /b 0
      - name: Third-party licenses
        run: |
          cargo install --locked cargo-about@0.9.3 --features cli || exit /b 1
          cargo about generate --locked -o THIRD-PARTY-LICENSES.md about.hbs
      # Windows' own tar writes the zip: Compress-Archive in Windows PowerShell
      # separates paths with backslashes, which the format does not allow.
      - name: Package
        run: |
          set "NAME=git-multibox-%GITHUB_REF_NAME%-x86_64-pc-windows-msvc"
          mkdir "dist\%NAME%" || exit /b 1
          for %%f in (target\release\git-multibox.exe target\release\multibox-ui.exe README.md README.en.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.md) do (
            copy /y "%%f" "dist\%NAME%\" >nul || exit /b 1
          )
          "%SystemRoot%\System32\tar.exe" -a -cf "dist\%NAME%.zip" -C dist "%NAME%"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          set -eu
          cargo install --locked cargo-about@0.9.3 --features cli
          cargo about generate --locked -o THIRD-PARTY-LICENSES.md about.hbs
          # As on Windows: no paths of the build machine in the programs.
          export RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$PWD=."
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p git-multibox -p multibox-ui --target "$target"
            if grep -a -l -F "$HOME" "target/$target/release/git-multibox" "target/$target/release/multibox-ui"; then
              echo "::error::the programs above still hold paths of the build machine"
              exit 1
            fi
            name="git-multibox-$GITHUB_REF_NAME-$target"
            mkdir -p "dist/$name"
            cp "target/$target/release/git-multibox" "target/$target/release/multibox-ui" README.md README.en.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.md "dist/$name/"
            # Without these, macOS metadata travels as ._ files and xattr
            # headers that other systems unpack as clutter.
            COPYFILE_DISABLE=1 /usr/bin/tar --no-xattrs --no-mac-metadata \
              -C dist -czf "dist/$name.tar.gz" "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  publish:
    needs: [windows, macos]
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write
    steps:
      # A directory of this job's own: the workspace holds the Windows build's.
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publish
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          Set-Location $env:RELEASE_DIR
          $files = Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name
          $sums = $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS", (($sums -join "`n") + "`n"))
          # gh reports progress on stderr; its exit code decides.
          $ErrorActionPreference = 'Continue'
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes @($files.Name) SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
