[package]
name = "multibox-ui"
description = "A window onto a repository's worktrees: what each one takes on disk, and buttons to clean them up"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# GPUI needs a newer compiler than the command-line tool's rust-version.
rust-version = "1.88"

[[bin]]
name = "multibox-ui"
path = "src/main.rs"

[dependencies]
multibox-clone.workspace = true
multibox-core.workspace = true
# GPUI (Zed's UI framework) with the GPUI Kit components, pinned together.
gpui-kit = "0.9.1"
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Hands the Dock the window's icon. The versions GPUI itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Builds the icon into the Windows program; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Draws the icon files from their SVG sources: the `icons` example.
resvg = { version = "0.46", default-features = false }
